name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 引擎测试（零依赖，无需 install）
        run: node --test tests/engine.test.mjs tests/state.test.mjs tests/search.test.mjs engine/ingest.test.js
      - name: CLI 冒烟（示例语料 + JSON 契约）
        run: |
          node engine/surface.mjs "部署,回滚" --root examples/partner-xiaolin --json | node -e "
          let raw='';
          process.stdin.on('data',c=>raw+=c).on('end',()=>{
            const d = JSON.parse(raw);
            if (!d.engine.startsWith('duiying-open')) throw new Error('engine: '+d.engine);
            if (!(d.total >= 2)) throw new Error('total: '+d.total);
            if (!('hint' in d)) throw new Error('no hint');
            console.log('CLI JSON 契约 OK ·', d.total, 'hits');
          });"
      - name: MCP 协议冒烟（initialize + tools/call）
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"memory_surface","arguments":{"query":"部署","root":["examples/partner-xiaolin"]}}}' \
            | node mcp/server.mjs 2>/dev/null | node -e "
          let raw='';
          process.stdin.on('data',c=>raw+=c).on('end',()=>{
            const msgs = {};
            for (const line of raw.trim().split('\n')) { const m = JSON.parse(line); msgs[m.id] = m; }
            if (msgs[1].result.serverInfo.name !== 'duiying-memory') throw new Error('serverInfo');
            const names = msgs[2].result.tools.map(t => t.name);
            if (!names.includes('memory_surface') || !names.includes('memory_doctor') || !names.includes('memory_ingest')) throw new Error('tools: '+names);
            if (!msgs[3].result.content[0].text.includes('除非对方问起')) throw new Error('hint text');
            console.log('MCP 协议 OK ·', names.join(', '));
          });"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 脱敏验收（禁忌模式零命中）
        run: node scripts/audit.mjs
