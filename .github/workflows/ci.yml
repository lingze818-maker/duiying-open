name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 引擎测试（零依赖，无需 install）
        run: node --test tests/engine.test.mjs tests/state.test.mjs
      - name: CLI 冒烟（示例语料 + JSON 契约）
        run: |
          node engine/surface.mjs "部署,回滚" --root examples/partner-xiaolin --json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['engine'].startswith('duiying-open'), d['engine']
          assert d['total'] >= 2, d['total']
          assert 'hint' in d
          print('CLI JSON 契约 OK ·', d['total'], 'hits')
          "
      - name: MCP 协议冒烟（initialize + tools/call）
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"memory_surface","arguments":{"query":"部署","root":["examples/partner-xiaolin"]}}}' \
            | node mcp/server.mjs 2>/dev/null | python3 -c "
          import json, sys
          msgs = {m['id']: m for m in map(json.loads, sys.stdin)}
          assert msgs[1]['result']['serverInfo']['name'] == 'duiying-memory'
          names = [t['name'] for t in msgs[2]['result']['tools']]
          assert 'memory_surface' in names and 'memory_doctor' in names, names
          text = msgs[3]['result']['content'][0]['text']
          assert '除非对方问起' in text
          print('MCP 协议 OK ·', names)
          "

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 脱敏验收（禁忌模式零命中）
        run: node scripts/audit.mjs
